[package]
name = "poker-server"
version = "0.1.0"
edition = "2024"

[dependencies]
poker_engine = { path = "../poker-engine" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
argon2 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
