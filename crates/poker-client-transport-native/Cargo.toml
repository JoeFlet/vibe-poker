[package]
name = "poker-client-transport-native"
version = "0.1.0"
edition = "2024"

# Native transport for poker-client-core. Step 25b per DESIGN.md.
# Owns the tokio TCP socket, framing, session-key persistence on
# the local filesystem, and the inbound/outbound pump loop.

[dependencies]
poker_engine = { path = "../poker-engine" }
poker-client-core = { path = "../poker-client-core" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
# Integration tests drive NativeClient against an in-process
# poker-server. Kept out of [dependencies] so downstream crates
# don't pull the server transitively.
poker-server = { path = "../poker-server" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
