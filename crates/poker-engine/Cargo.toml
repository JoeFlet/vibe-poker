[package]
name = "poker_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
smallvec = { version = "1", features = ["serde"] }
rmp-serde = "1"
rs_poker = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine"
harness = false

[[bin]]
name = "poker_report"
path = "src/main.rs"
